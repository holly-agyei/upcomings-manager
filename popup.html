<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Opportunity Saver</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <nav class="tabs" role="tablist">
                <button class="tab active" role="tab" aria-selected="true" aria-controls="add-tab" data-tab="add">
                    <svg class="tab-icon" viewBox="0 0 24 24" width="16" height="16">
                        <path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                    </svg>
                    Add New
                </button>
                <button class="tab" role="tab" aria-selected="false" aria-controls="view-tab" data-tab="view">
                    <svg class="tab-icon" viewBox="0 0 24 24" width="16" height="16">
                        <path fill="currentColor" d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>
                    </svg>
                    View All
                </button>
            </nav>
        </header>

        <main>
            <div id="add-tab" class="tab-content active" role="tabpanel" aria-labelledby="add-tab">
                <form id="opportunity-form">
                    <div class="form-group">
                        <label for="opportunity-name">Opportunity Name<span class="required">*</span></label>
                        <input type="text" id="opportunity-name" name="opportunity-name" 
                               placeholder="Enter opportunity name" required 
                               aria-required="true">
                    </div>

                    <div class="form-group">
                        <label for="notes">Additional Notes</label>
                        <textarea id="notes" name="notes" 
                                  placeholder="Add any additional information"
                                  aria-label="Additional notes"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="deadline">Deadline</label>
                        <input type="date" id="deadline" name="deadline"
                               aria-label="Deadline date">
                    </div>

                    <div class="form-group">
                        <label for="link">Link</label>
                        <input type="url" id="link" name="link" 
                               placeholder="https://"
                               aria-label="Related link">
                    </div>

                    <div class="button-group">
                        <button type="submit" id="submit-btn" class="submit-btn">
                            <svg class="save-icon" viewBox="0 0 24 24" width="18" height="18">
                                <path fill="currentColor" d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm2 16H5V5h11.17L19 7.83V19zm-7-7c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                            </svg>
                            Save Opportunity
                        </button>
                    </div>
                </form>
            </div>

            <div id="view-tab" class="tab-content" role="tabpanel" aria-labelledby="view-tab">
                <div class="filter-group">
                    <label for="view-filter">Filter Opportunities</label>
                    <select id="view-filter" aria-label="Filter opportunities">
                        <option value="upcoming">Upcoming</option>
                        <option value="past">Past</option>
                        <option value="all">All</option>
                    </select>
                </div>
                <div id="opportunities-list" class="opportunities-list" role="list" aria-label="Saved opportunities">
                    <!-- Opportunities will be listed here -->
                </div>
            </div>
        </main>
    </div>
    <script src="popup.js"></script>
</body>
</html>
